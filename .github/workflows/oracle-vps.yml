name: Oracle Always Free VPS

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
    inputs:
      diagnostic:
        description: 'Diagnóstico somente leitura (não cria jobs nem Issues)'
        type: boolean
        default: true
      configure_boot_disk:
        description: 'Preparar somente disco 50 GB/Balanced na stack aprovada, sem criar recursos'
        type: boolean
        default: false
      test_notification:
        description: 'Enviar aviso de teste na Issue, sem chamar a Oracle'
        type: boolean
        default: false
      resume_blocked:
        description: 'Retomar após corrigir um bloqueio (não ignora validações)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: oracle-always-free-single-stack
  cancel-in-progress: false

jobs:
  retry:
    # No PR/push triggers. A schedule must be explicitly enabled after review.
    if: github.event_name == 'workflow_dispatch' || vars.RETRY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONUNBUFFERED: '1'
      RETRY_ENABLED: ${{ vars.RETRY_ENABLED }}
      ZERO_COST_CONFIRMED: ${{ vars.ZERO_COST_CONFIRMED }}
      APPROVED_STACK_SHA256: ${{ vars.APPROVED_STACK_SHA256 }}
      OCI_REGION: sa-saopaulo-1
      GH_REPO: ${{ github.repository }}
      NOTIFY_USER: DanielSCaldeira
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      DIAGNOSTIC: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic || false }}
      CONFIGURE_BOOT_DISK: ${{ github.event_name == 'workflow_dispatch' && inputs.configure_boot_disk || false }}
      TEST_NOTIFICATION: ${{ github.event_name == 'workflow_dispatch' && inputs.test_notification || false }}
      RESUME_BLOCKED: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_blocked || false }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node.js 24
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node.js 24
        with:
          python-version: '3.11'
      - name: Install SDK
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Tests
        if: github.event_name != 'schedule'
        run: python -m unittest discover -s tests -v
      - name: Check stack / attempt once
        env:
          OCI_STACK_ID: ${{ secrets.OCI_STACK_ID }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_KEY_PASSPHRASE: ${{ secrets.OCI_KEY_PASSPHRASE }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/tentar_vps.py

      - name: Ping Healthchecks (sucesso)
        if: success()
        run: curl -fsS -m 10 --retry 3 https://hc-ping.com/f54c6b85-5e72-4dad-91e6-11c49b7307e9
      - name: Ping Healthchecks (falha)
        if: failure()
        run: curl -fsS -m 10 --retry 3 https://hc-ping.com/f54c6b85-5e72-4dad-91e6-11c49b7307e9/fail
